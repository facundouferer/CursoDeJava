name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compile:
    name: Compile all Java sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        # Source files use mixed encodings (UTF-8 and ISO-8859-1). ISO-8859-1 maps
        # every byte, so javac never fails on encoding and only real errors surface.
        run: |
          mkdir -p build/classes
          find src -name '*.java' -not -path 'src/bin/*' > sources.txt
          echo "Compiling $(wc -l < sources.txt) files"
          javac -Xlint:-options -encoding ISO-8859-1 \
            -cp mysql-connector-j-8.1.0.jar \
            -d build/classes \
            @sources.txt

  merge-conflicts:
    name: Check for merge conflicts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the PR merges cleanly into the base branch
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git fetch origin "${{ github.base_ref }}"
          git merge --no-commit --no-ff "origin/${{ github.base_ref }}" || {
            echo "::error::This pull request has merge conflicts with ${{ github.base_ref }}. Resolve them before merging."
            git diff --name-only --diff-filter=U
            exit 1
          }

      - name: Check for leftover conflict markers
        run: |
          if grep -rEn '^(<<<<<<<|=======|>>>>>>>)( |$)' --include='*.java' src; then
            echo "::error::Conflict markers found in source files."
            exit 1
          fi
